<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- White rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- Subtle grid lines -->
  <g clip-path="url(#rounded)" opacity="0.07">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#4f9cf9" stroke-width="1.5"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#4f9cf9" stroke-width="1.5"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#4f9cf9" stroke-width="1.5"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#4f9cf9" stroke-width="1.5"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#4f9cf9" stroke-width="1.5"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#4f9cf9" stroke-width="1.5"/>
  </g>

  <!-- Pin shadow -->
  <ellipse cx="256" cy="400" rx="52" ry="14" fill="#c8dff8" opacity="0.5"/>

  <!-- Pin body teardrop -->
  <path d="M256 90
           C196 90 141 140 141 210
           C141 280 226 350 256 400
           C286 350 371 280 371 210
           C371 140 316 90 256 90 Z"
        fill="#4f9cf9"/>

  <!-- Pin highlight shine -->
  <path d="M211 118
           C191 133 174 158 171 186
           C181 166 196 148 211 138 Z"
        fill="#ffffff" opacity="0.25"/>

  <!-- Pin inner hole -->
  <circle cx="256" cy="210" r="52" fill="#ffffff"/>

  <!-- Inner dot -->
  <circle cx="256" cy="210" r="20" fill="#4f9cf9"/>
</svg>
